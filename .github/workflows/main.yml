name: Build PINGS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DPNG_BUILD_TESTS=ON

      - name: Build AU, VST3 and the engine test
        run: |
          set -o pipefail
          cmake --build build --config Release --target PINGS_AU PINGS_VST3 PINGS_Test -j 4 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: grep -E "error|Error" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Run offline engine test
        run: ./build/PINGS_Test

      - name: Sign (ad hoc) and zip
        run: |
          ART=build/PINGS_artefacts/Release
          codesign --force --deep --sign - "$ART/AU/PINGS.component"
          codesign --force --deep --sign - "$ART/VST3/PINGS.vst3"
          mkdir -p dist
          ditto -c -k --keepParent "$ART/AU/PINGS.component" dist/PINGS-AU.zip
          ditto -c -k --keepParent "$ART/VST3/PINGS.vst3" dist/PINGS-VST3.zip

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: PINGS-macOS
          path: dist/*.zip

      - name: Validate AU with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/PINGS_artefacts/Release/AU/PINGS.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumf Pngs Mnrs
